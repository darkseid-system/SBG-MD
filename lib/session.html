<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBG-MD SESSION</title><style>body{margin:0;font-family:Arial,sans-serif;background:#07120d;color:#fff;display:grid;place-items:center;min-height:100vh}.card{width:min(92%,480px);padding:28px;border:1px solid #1e5b3c;border-radius:20px;background:#0b1d14;box-shadow:0 15px 50px #0008}h1{margin-top:0}input,button,textarea{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:10px;border:1px solid #285e45;background:#08140e;color:#fff}button{cursor:pointer;background:#174d32;font-weight:bold}.code{font-size:26px;letter-spacing:4px;text-align:center;margin:18px 0}</style></head><body><div class="card"><h1>🔐 SBG-MD SESSION</h1><p>Enter your WhatsApp number with country code, without +.</p><input id="phone" placeholder="509XXXXXXXX" inputmode="numeric"><button onclick="start()">GENERATE PAIRING CODE</button><div id="out"></div></div><script>async function start(){const out=document.getElementById('out');out.textContent='Starting…';const phone=document.getElementById('phone').value;const r=await fetch('/api/session/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:phone})});const d=await r.json();if(!r.ok){out.textContent='❌ '+d.error;return}poll(d.jobId)}async function poll(id){const out=document.getElementById('out');const r=await fetch('/api/session/status/'+id);const d=await r.json();if(d.code){out.innerHTML='<div class="code">'+d.code+'</div><p>Enter this code in WhatsApp → Linked devices → Link with phone number.</p>'}if(d.status==='complete'){out.innerHTML+='<p>✅ SESSION READY</p><textarea rows="8" readonly>'+d.session+'</textarea><button onclick="navigator.clipboard.writeText(document.querySelector(\'textarea\').value)">COPY SESSION</button>';return}if(d.status==='error'){out.innerHTML+='❌ '+d.error;return}setTimeout(()=>poll(id),2000)}</script></body></html>
